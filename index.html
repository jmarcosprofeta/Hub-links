<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Creative Experience | Estúdio Marcos & Vistoria de Imóveis</title>
    
    <!-- FAVICON LINKADO DIRETO -->
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Canvas Layer -->
    <div id="background-layer">
        <canvas id="space-canvas"></canvas>
        <canvas id="astronaut-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
    </div>

    <!-- Cosmic Orbital Ring System com Indicador HUD -->
    <div id="orbital-system" aria-hidden="true">
        <!-- ESCRITA HUD CIBERNÉTICO CENTRALIZADA -->
        <div id="scroll-hint" data-i18n="scroll_hint">[ SYS_SCROLL // EXPLORAR ]</div>

        <div class="orbit-ring ring-inner">
            <span class="orbit-node node-1"></span>
        </div>
        <div class="orbit-ring ring-middle">
            <span class="orbit-node node-2"></span>
        </div>
        <div class="orbit-ring ring-outer">
            <span class="orbit-node node-3"></span>
        </div>
    </div>

    <!-- Scroll Progress Indicator -->
    <div id="scroll-progress-track">
        <div id="scroll-progress-fill"></div>
    </div>
    <div id="scroll-progress-label">
        <span id="scroll-phase-text" data-i18n="phase_start">INÍCIO</span>
        <span id="scroll-percent">0%</span>
    </div>

    <!-- Foreground Layer: Native Scroll -->
    <main id="foreground-layer">
        <div class="scroll-spacer"></div>
    </main>

    <!-- Orbital Floating Glass Pill Buttons -->
    <div id="orbital-buttons-container">
        <a id="btn-estudio" href="https://www.estudiomarcos.space/home" target="_blank" rel="noopener noreferrer" class="orbital-pill-btn btn-estudio" aria-label="ESTÚDIO MARCOS">
            <span class="btn-glow-dot dot-mint"></span>
            <span class="btn-text" data-i18n="btn_estudio">ESTÚDIO MARCOS</span>
        </a>

        <a id="btn-vistoria" href="https://www.inovevistoria.online/home" target="_blank" rel="noopener noreferrer" class="orbital-pill-btn btn-vistoria" aria-label="VISTORIA DE IMÓVEIS">
            <span class="btn-glow-dot dot-gold"></span>
            <span class="btn-text" data-i18n="btn_vistoria">VISTORIA DE IMÓVEIS</span>
        </a>
        
        <a id="btn-facebook" href="https://www.facebook.com/profile.php?id=61583786202984&locale=pt_BR" target="_blank" rel="noopener noreferrer" class="orbital-pill-btn btn-facebook" aria-label="FACEBOOK INOVE VISTORIA">
            <span class="btn-glow-dot dot-blue"></span>
            <span class="btn-text" data-i18n="btn_facebook">PÁGINA INOVE VISTORIA</span>
        </a>
    </div>

    <!-- FOOTER TERMINAL COM SELETOR DE IDIOMA -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="lang-selector-wrapper">
                <select id="language-select" class="lang-select">
                    <option value="da">Dansk</option>
                    <option value="de">Deutsch</option>
                    <option value="el">Ελληνικά</option>
                    <option value="en">English</option>
                    <option value="en-gb">English (UK)</option>
                    <option value="es-es">Español (España)</option>
                    <option value="es">Español</option>
                    <option value="fa">فارسی</option>
                    <option value="fi">Suomi</option>
                    <option value="fr">Français</option>
                    <option value="he">עברית</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="it">Italiano</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="ms">Bahasa Melayu</option>
                    <option value="no">Norsk</option>
                    <option value="nl">Nederlands</option>
                    <option value="pl">Polski</option>
                    <option value="pt-br" selected>Português (Brasil)</option>
                </select>
                <span class="custom-arrow"></span>
            </div>
            <span class="copyright-text" data-i18n="copyright"> © 2026 ESTÚDIO MARCOS </span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
